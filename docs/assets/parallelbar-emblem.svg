<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Parallel-bar resistive computing emblem</title>
  <desc id="desc">Two parallel gold rails connected by three red resistive rungs, with a sensing node at the output.</desc>
  <defs>
    <linearGradient id="bg" x1="8" y1="4" x2="56" y2="60" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3d292e"/>
      <stop offset="1" stop-color="#21191c"/>
    </linearGradient>
    <linearGradient id="rail" x1="0" y1="8" x2="0" y2="56" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f0c76b"/>
      <stop offset="1" stop-color="#b98527"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#bg)"/>
  <rect x="3" y="3" width="58" height="58" rx="14" fill="none" stroke="#f2d591" stroke-opacity=".25" stroke-width="2"/>
  <path d="M18 10v44M43 10v44" fill="none" stroke="url(#rail)" stroke-width="4" stroke-linecap="round"/>
  <g fill="none" stroke="#d44b45" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M18 19h4l2.6-3 4.8 6 4.8-6 4.8 6 2.6-3H43"/>
    <path d="M18 32h4l2.6-3 4.8 6 4.8-6 4.8 6 2.6-3H43"/>
    <path d="M18 45h4l2.6-3 4.8 6 4.8-6 4.8 6 2.6-3H43"/>
  </g>
  <path d="M43 32h9" stroke="#f0c76b" stroke-width="3" stroke-linecap="round"/>
  <circle cx="55" cy="32" r="4.5" fill="#d44b45" stroke="#f2d591" stroke-width="2"/>
</svg>
